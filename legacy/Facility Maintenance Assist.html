<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Facility Maintenance Assist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e2e5ea;--ac:#1d6fb8;--ok:#15803d;--wn:#b45309;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2d3744;--ac:#5aa9e6;--ok:#4ade80;--wn:#fbbf24;--er:#f87171}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}main{max-width:1000px;margin:0 auto;padding:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;max-width:1000px;margin:0 auto}
nav button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.s{padding:3px 8px;font-size:13px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.k{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:top}th{color:var(--mu);font-weight:600}
.b{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}
.f{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:10px}
.f label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
select.big{font-weight:600}.pill{display:inline-block;margin:2px;padding:2px 8px;border:1px solid var(--bd);border-radius:99px;font-size:13px}.two{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}</style></head><body>
<header><h1>🛠️ Facility Maintenance Assist</h1>
<div class="r" style="margin:0"><select id="bsel" class="big"></select><select id="ssel"><option value="">All services</option><option>In-house PPM</option><option>AMC PPM</option></select><span id="who" class="mu"></span></div></header>
<nav id="nav"></nav><main id="v"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const diff=d=>Math.round((new Date(d)-new Date(today()))/864e5);
const BLDS=['SS1','SS2','GS1','GS2','GS4','GS6','GS7','GS8','GS9','GS12','GS14','GS15','GS16','GS17','GS18','GS19','GS20','GST','AL KIFAF','UMAQ 05','UMAQ 07','UMAQ 08','ZEENAH'];
const FREQ={Weekly:7,Monthly:30,Quarterly:91,'Half-yearly':182,Yearly:365};
const CATS=['HVAC / AC','Electrical','Fire fighting','Plumbing / Pumps','Lifts','Generator','BMS / CCTV','Other'];
const IH='In-house PPM',AM='AMC PPM',EXTRA=['Breakdown / Corrective','Inspection'];
let eq=[],sv=[],staff=[],names={},tab='Dashboard',dbE=null,dbS=null,dbF=null,uid=null,bld='',scope='',filt={},ready=false;
let me={role:'admin',blds:BLDS};           // demo/local fallback = admin
const isAdmin=()=>me.role==='admin',isSup=()=>me.role==='admin'||me.role==='supervisor';
const allowed=()=>isAdmin()?BLDS:(me.blds||[]);
const vis=x=>allowed().includes(x.bld)&&(!bld||x.bld===bld)&&(!scope||x.contract===scope);
const EQ=()=>eq.filter(vis),SV=()=>sv.filter(vis);
const canLog=e=>e&&allowed().includes(e.bld)&&(isSup()||e.contract===IH);
const TABS=()=>['Dashboard','Schedule','Equipment','Log Service','History','Reports',...(isAdmin()?['Staff & Access']:[])];
const status=e=>{if(!e.nextDue)return['No plan','mu'];const d=diff(e.nextDue);return d<0?[`Overdue ${-d}d`,'er']:d<=7?[`Due in ${d}d`,'wn']:[`Due in ${d}d`,'ok']};
const badge=e=>{const[t,c]=status(e);return`<span class="b ${c}">${t}</span>`};
const eName=id=>(eq.find(e=>e.id===id)||{name:'(deleted)'}).name;
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const uidn=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const COL={equipment:()=>[eq,dbE],services:()=>[sv,dbS],staff:()=>[staff,dbF]};
async function save(col,id,data){const[arr,ref]=COL[col]();const i=arr.findIndex(x=>x.id===id);const o={...(i>-1?arr[i]:{}),...data,id};
  if(i>-1)arr[i]=o;else arr.push(o);if(ref){try{await ref.doc(id).set(o)}catch(e){alert('Save failed: '+(e.message||e.code))}}render()}
async function del(col,id){if(!confirm('Delete this record?'))return;const[arr,ref]=COL[col]();const i=arr.findIndex(x=>x.id===id);if(i>-1)arr.splice(i,1);if(ref){try{await ref.doc(id).delete()}catch(e){}}render()}
function setMe(){const a=staff.find(s=>s.id===uid);
  if(!ready||!dbF){me={role:'admin',blds:BLDS}}
  else if(window._owner)me={role:'admin',blds:BLDS};
  else if(a)me={role:a.role,blds:a.blds||[]};else me={role:'none',blds:[]};
  const al=allowed();if(bld&&!al.includes(bld))bld='';
  $('#bsel').innerHTML=`<option value="">${isAdmin()||al.length>1?'All '+(isAdmin()?'buildings':'my buildings'):'—'}</option>`+al.map(b=>`<option ${b===bld?'selected':''}>${esc(b)}</option>`).join('');
  $('#who').textContent=({admin:'Admin',supervisor:'Supervisor',technician:'Technician',none:'No access'})[me.role]+(dbF?' ● shared':' · local')}
$('#bsel').onchange=e=>{bld=e.target.value;render()};$('#ssel').onchange=e=>{scope=e.target.value;render()};

function stats(l,sl,t){const od=l.filter(e=>e.nextDue&&diff(e.nextDue)<0),du=l.filter(e=>e.nextDue&&diff(e.nextDue)>=0&&diff(e.nextDue)<=7),m=today().slice(0,7);
  const pc=l.length?Math.round(100*(l.length-od.length)/l.length):100;
  return`<div class="c"><b>${t}</b><div class="g" style="margin:8px 0"><div><div class="mu">Equipment</div><div class="k">${l.length}</div></div><div><div class="mu">Overdue</div><div class="k er">${od.length}</div></div><div><div class="mu">Due ≤7d</div><div class="k wn">${du.length}</div></div><div><div class="mu">Done this month</div><div class="k">${sl.filter(s=>s.date.startsWith(m)&&s.status==='Completed').length}</div></div></div><div class="mu">Compliance ${pc}%</div><div class="bar"><i style="width:${pc}%"></i></div></div>`}
function dash(){const l=EQ(),up=l.filter(e=>e.nextDue&&diff(e.nextDue)<=7).sort((a,b)=>a.nextDue.localeCompare(b.nextDue)).slice(0,8),s=SV();
  const byB=bld?'':BLDS.filter(b=>allowed().includes(b)).map(b=>[b,l.filter(e=>e.bld===b&&e.nextDue&&diff(e.nextDue)<0).length]).filter(x=>x[1]);
  return`<div class="two">${stats(l.filter(e=>e.contract===IH),s.filter(x=>x.contract===IH),'🔧 In-house PPM')}${stats(l.filter(e=>e.contract===AM),s.filter(x=>x.contract===AM),'📑 AMC PPM (contractor)')}</div>
  <div class="c"><b>🔔 Reminders</b>${up.length?`<div class="tw"><table>${up.map(e=>`<tr><td>${esc(e.name)}<div class="mu">${esc(e.bld)} · ${esc(e.location)}</div></td><td>${esc(e.contract)}</td><td>${e.nextDue}</td><td>${badge(e)}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nothing due in the next 7 days.</p>'}</div>
  ${byB.length?`<div class="c"><b>Overdue by building</b><div>${byB.map(([b,n])=>`<span class="pill er">${esc(b)}: ${n}</span>`).join('')}</div></div>`:''}`}
function sched(){const l=EQ().filter(e=>e.nextDue).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  return`<div class="c"><b>Upcoming &amp; overdue services</b><div class="tw"><table><tr><th>Due</th><th>Building</th><th>Equipment</th><th>Type</th><th>Status</th><th></th></tr>${l.map(e=>`<tr><td>${e.nextDue}</td><td>${esc(e.bld)}</td><td>${esc(e.name)}<div class="mu">${esc(e.location)}</div></td><td>${esc(e.contract)} · ${esc(e.freq)}<div class="mu">${esc(e.vendor)}</div></td><td>${badge(e)}</td><td>${canLog(e)?`<button class="s" data-log="${e.id}">Log</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">No schedules yet.</td></tr>'}</table></div></div>`}
function equip(){const ed=filt.edit&&eq.find(e=>e.id===filt.edit)||{},al=allowed();
  const form=isSup()?`<div class="c"><b>${ed.id?'Edit':'Add'} equipment</b><div class="f" id="ef" style="margin-top:8px">
  <label>Building<select name="bld">${opts(al,ed.bld||bld)}</select></label><label>Name<input name="name" value="${esc(ed.name)}"></label><label>Asset tag / ID<input name="tag" value="${esc(ed.tag)}"></label>
  <label>Location / floor<input name="location" value="${esc(ed.location)}"></label><label>Category<select name="cat">${opts(CATS,ed.cat)}</select></label>
  <label>PPM type<select name="contract">${opts([IH,AM],ed.contract)}</select></label><label>Frequency<select name="freq">${opts(Object.keys(FREQ),ed.freq||'Quarterly')}</select></label>
  <label>AMC vendor / contact<input name="vendor" value="${esc(ed.vendor)}"></label><label>AMC expiry<input type="date" name="amcEnd" value="${esc(ed.amcEnd)}"></label>
  <label>Last serviced<input type="date" name="last" value="${esc(ed.last)}"></label></div><button class="p" id="esave">${ed.id?'Update':'Add'}</button> ${ed.id?'<button id="ecan">Cancel</button>':''}</div>`:'<p class="mu">Only Supervisors/Admin can add or edit equipment.</p>';
  return form+`<div class="c"><div class="tw"><table><tr><th>Building</th><th>Equipment</th><th>Type</th><th>AMC expiry</th><th>Next due</th><th></th></tr>${EQ().map(e=>`<tr><td>${esc(e.bld)}</td><td>${esc(e.name)}<div class="mu">${esc(e.tag)} · ${esc(e.location)} · ${esc(e.cat)}</div></td><td>${esc(e.contract)}<div class="mu">${esc(e.vendor)}</div></td><td>${e.amcEnd?`${e.amcEnd}${diff(e.amcEnd)<0?' <span class="b er">expired</span>':diff(e.amcEnd)<=30?' <span class="b wn">soon</span>':''}`:'—'}</td><td>${e.nextDue||'—'} ${badge(e)}</td><td><button class="s" data-hist="${e.id}">History</button> ${isSup()?`<button class="s" data-ed="${e.id}">Edit</button><button class="s" data-del="${e.id}">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">No equipment for this selection.</td></tr>'}</table></div></div>`}
const typesFor=e=>e?[e.contract===IH?IH:'AMC PPM visit',...EXTRA]:[];
function logf(){const l=EQ().filter(canLog),pre=filt.log||'',pe=l.find(e=>e.id===pre);
  return`<div class="c"><b>Record a service</b>${me.role==='technician'?'<div class="mu">Technicians can record In-house PPM and breakdowns for their assigned buildings.</div>':''}<div class="f" id="lf" style="margin-top:8px">
  <label>Equipment<select name="eid"><option value="">Select…</option>${l.map(e=>`<option value="${e.id}" ${e.id===pre?'selected':''}>${esc(e.bld)} · ${esc(e.name)} (${esc(e.contract)})</option>`).join('')}</select></label>
  <label>Date<input type="date" name="date" value="${today()}"></label><label>Service type<select name="type">${opts(typesFor(pe))}</select></label>
  <label>Done by<input name="by" placeholder="Technician / vendor"></label><label>Status<select name="status">${opts(['Completed','In progress','Pending parts','Escalated'])}</select></label>
  <label>Job card / ref no.<input name="ref"></label><label>Cost (optional)<input type="number" name="cost" min="0"></label></div>
  <label class="mu">Work done / observations<textarea name="notes" rows="3" style="width:100%"></textarea></label><div class="r"><button class="p" id="lsave">Save service record</button></div></div>`}
function filtered(){return SV().filter(s=>(!filt.e||s.eid===filt.e)&&(!filt.t||s.type===filt.t)&&(!filt.s||s.status===filt.s)&&(!filt.from||s.date>=filt.from)&&(!filt.to||s.date<=filt.to)).sort((a,b)=>b.date.localeCompare(a.date))}
const ALLT=[IH,'AMC PPM visit',...EXTRA];
function filterBar(){return`<div class="f" id="ff"><label>Equipment<select name="e"><option value="">All</option>${EQ().map(e=>`<option value="${e.id}" ${filt.e===e.id?'selected':''}>${esc(e.name)} (${esc(e.bld)})</option>`).join('')}</select></label><label>Type<select name="t"><option value="">All</option>${opts(ALLT,filt.t)}</select></label><label>Status<select name="s"><option value="">All</option>${opts(['Completed','In progress','Pending parts','Escalated'],filt.s)}</select></label><label>From<input type="date" name="from" value="${filt.from||''}"></label><label>To<input type="date" name="to" value="${filt.to||''}"></label></div>`}
const rows=(l,x)=>l.map(s=>`<tr><td>${s.date}</td><td>${esc(s.bld)}</td><td>${esc(eName(s.eid))}</td><td>${esc(s.type)}</td><td>${esc(s.by)}</td><td><span class="b ${s.status==='Completed'?'ok':'wn'}">${esc(s.status)}</span></td><td>${esc(s.notes)}${s.ref?`<div class="mu">Ref: ${esc(s.ref)}</div>`:''}</td>${x&&isSup()?`<td><button class="s" data-sdel="${s.id}">✕</button></td>`:''}</tr>`).join('')||'<tr><td colspan=8 class="mu">No records.</td></tr>';
const TH='<th>Date</th><th>Bldg</th><th>Equipment</th><th>Type</th><th>By</th><th>Status</th><th>Notes</th>';
function hist(){return`<div class="c"><b>Service history</b>${filterBar()}<div class="tw"><table><tr>${TH}${isSup()?'<th></th>':''}</tr>${rows(filtered(),1)}</table></div></div>`}
function reports(){const l=filtered(),by=k=>{const m={};l.forEach(s=>m[s[k]]=(m[s[k]]||0)+1);return m},cost=l.reduce((a,s)=>a+(+s.cost||0),0);
  const li=o=>Object.entries(o).map(([k,v])=>`<div>${esc(k)}: <b>${v}</b></div>`).join('')||'<span class="mu">—</span>';
  const od=EQ().filter(e=>e.nextDue&&diff(e.nextDue)<0),amc=EQ().filter(e=>e.contract===AM&&e.amcEnd&&diff(e.amcEnd)<=60);
  return`<div class="c"><b>Report filters</b> <span class="mu">(building &amp; service scope from the top bar apply)</span>${filterBar()}<div class="r"><button class="p" id="csv">⬇ Export CSV</button><button id="prt">🖨 Print</button></div></div>
  <div class="g"><div class="c"><div class="mu">Records</div><div class="k">${l.length}</div></div><div class="c"><div class="mu">Total cost</div><div class="k">${cost.toLocaleString()}</div></div><div class="c"><div class="mu">By type</div>${li(by('type'))}</div><div class="c"><div class="mu">By building</div>${li(by('bld'))}</div></div>
  <div class="c"><b>Overdue (${od.length})</b>${od.map(e=>`<div>${esc(e.bld)} · ${esc(e.name)} (${esc(e.contract)}) — due ${e.nextDue}</div>`).join('')||'<div class="mu">None</div>'}</div>
  <div class="c"><b>AMC contracts expiring ≤60 days / expired (${amc.length})</b>${amc.map(e=>`<div>${esc(e.bld)} · ${esc(e.name)} — ${e.amcEnd} (${esc(e.vendor)})</div>`).join('')||'<div class="mu">None</div>'}</div>
  <div class="c"><b>Detail</b><div class="tw"><table><tr>${TH}</tr>${rows(l,0)}</table></div></div>`}
function staffTab(){return`<div class="c"><b>Add staff</b><div class="r"><input id="sq" placeholder="Search name…"><button id="sgo">Search</button></div><div id="sres" class="mu"></div></div>
  <div class="c"><b>Staff &amp; building access</b><p class="mu">A supervisor's building set is their cluster. Admins (page owner/editors) see everything. Technicians only see and update their assigned buildings.</p>
  ${staff.map(s=>`<div class="c" data-sid="${s.id}"><div class="r"><b>${esc(names[s.id]||'Staff '+s.id.slice(0,6))}</b><select class="rl"><option value="supervisor" ${s.role==='supervisor'?'selected':''}>Supervisor</option><option value="technician" ${s.role==='technician'?'selected':''}>Technician</option></select><button class="s" data-sd="${s.id}">Remove</button></div>
  <div>${BLDS.map(b=>`<label class="pill"><input type="checkbox" value="${b}" ${(s.blds||[]).includes(b)?'checked':''}> ${esc(b)}</label>`).join('')}</div><button class="s p sv" style="margin-top:6px">Save access</button></div>`).join('')||'<p class="mu">No staff added yet.</p>'}</div>`}

function render(){setMe();const nv=$('#nav'),T=TABS();if(!T.includes(tab))tab='Dashboard';
  nv.innerHTML=T.map(t=>`<button class="${t===tab?'on':''}" data-t="${t}">${t}</button>`).join('');nv.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  const v=$('#v');if(me.role==='none'){v.innerHTML='<div class="c"><b>No access yet</b><p class="mu">Ask the Admin to assign you to your building(s).</p></div>';return}
  v.innerHTML=({Dashboard:dash,Schedule:sched,Equipment:equip,'Log Service':logf,History:hist,Reports:reports,'Staff & Access':staffTab})[tab]();
  v.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{filt.log=b.dataset.log;tab='Log Service';render()});
  v.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>{filt={e:b.dataset.hist};tab='History';render()});
  v.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{filt.edit=b.dataset.ed;render()});
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del('equipment',b.dataset.del));
  v.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>del('services',b.dataset.sdel));
  v.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>del('staff',b.dataset.sd));
  v.querySelectorAll('.sv').forEach(b=>b.onclick=()=>{const c=b.closest('[data-sid]');save('staff',c.dataset.sid,{role:c.querySelector('.rl').value,blds:[...c.querySelectorAll('input:checked')].map(i=>i.value)})});
  const sg=$('#sgo');if(sg)sg.onclick=async()=>{try{const u=await claude.use('user'),r=await u.search($('#sq').value);$('#sres').innerHTML=r.length?r.map(p=>`<div><button class="s" data-add="${p.id}">Add</button> ${esc(p.name||p.id)}</div>`).join(''):'No match';
    $('#sres').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!staff.find(s=>s.id===b.dataset.add))save('staff',b.dataset.add,{role:'technician',blds:[]});names[b.dataset.add]=r.find(p=>p.id===b.dataset.add).name;render()})}catch(e){$('#sres').textContent='Search unavailable'}};
  const ff=$('#ff');if(ff)ff.querySelectorAll('select,input').forEach(i=>i.onchange=()=>{filt[i.name]=i.value;render()});
  const lf=$('#lf');if(lf)lf.querySelector('[name=eid]').onchange=e=>{lf.querySelector('[name=type]').innerHTML=opts(typesFor(eq.find(x=>x.id===e.target.value)))};
  const es=$('#esave');if(es)es.onclick=()=>{const d={};$('#ef').querySelectorAll('input,select').forEach(i=>d[i.name]=i.value.trim());if(!d.name||!d.bld)return alert('Building and name are required');
    const old=filt.edit&&eq.find(e=>e.id===filt.edit);d.nextDue=d.last?addD(d.last,FREQ[d.freq]):(old&&old.nextDue)||addD(today(),FREQ[d.freq]);const id=filt.edit||uidn();filt.edit=null;save('equipment',id,d)};
  const ec=$('#ecan');if(ec)ec.onclick=()=>{filt.edit=null;render()};
  const ls=$('#lsave');if(ls)ls.onclick=async()=>{const d={};$('#lf').parentNode.querySelectorAll('input,select,textarea').forEach(i=>d[i.name]=i.value.trim());
    const e=eq.find(x=>x.id===d.eid);if(!canLog(e))return alert('Select equipment you are allowed to update');if(!d.by)return alert('Enter who did the work');
    d.bld=e.bld;d.contract=e.contract;d.user=uid;await save('services',uidn(),d);
    if(d.status==='Completed'&&!EXTRA.includes(d.type))await save('equipment',e.id,{last:d.date,nextDue:addD(d.date,FREQ[e.freq]||30)});filt={};tab='History';render()};
  const c=$('#csv');if(c)c.onclick=async()=>{const q=x=>`"${String(x??'').replace(/"/g,'""')}"`;
    const csv=['Date,Building,Equipment,Location,PPM type,Service type,Done by,Status,Ref,Cost,Notes',...filtered().map(s=>{const e=eq.find(x=>x.id===s.eid)||{};return[s.date,s.bld,e.name,e.location,s.contract,s.type,s.by,s.status,s.ref,s.cost,s.notes].map(q).join(',')})].join('\n');
